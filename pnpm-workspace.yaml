packages:
  - apps/*
  - packages/*
  - tests/integrations/*

allowBuilds:
  esbuild: true

minimumReleaseAge: 4320

# Exact security exception for GHSA-mh99-v99m-4gvg.
minimumReleaseAgeExclude:
  - brace-expansion@5.0.8

overrides:
  "brace-expansion@>=5.0.0 <5.0.8": 5.0.8
  # Exact security override for GHSA-r28c-9q8g-f849. Panda's transitive
  # PostCSS range accepts this patched version.
  "postcss@<8.5.18": 8.5.22
  # Exact security override for GHSA-f88m-g3jw-g9cj. Remove once the pinned
  # Wrangler resolves sharp >=0.35.0.
  "sharp@<0.35.0": 0.35.3
